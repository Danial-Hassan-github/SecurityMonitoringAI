<div class="incidents">

  <mat-card class="incidents-card">

    <mat-card-content>

      <div class="toolbar">

                <div class="search-box">
                    <mat-icon>search</mat-icon>

                    <input type="text" placeholder="Incident, IP, severity, status..." (input)="searchIncidents($event)" />

                    <span class="search-shortcut">/</span>
                </div>


                <button class="filter-button" mat-stroked-button type="button">

                    <mat-icon>tune</mat-icon>
                    Filters

                </button>

            </div>


      <div class="table-container">

        <table
          mat-table
          [dataSource]="filteredIncidents">

          <ng-container matColumnDef="incident">

            <th mat-header-cell *matHeaderCellDef>
              Incident
            </th>

            <td mat-cell *matCellDef="let incident">

              <div class="incident-name">

                <div
                  class="severity-dot"
                  [class]="incident.severity.toLowerCase()">
                </div>

                <div>
                  <strong>
                    {{ incident.incident }}
                  </strong>

                  <span>
                    Security Detection
                  </span>
                </div>

              </div>

            </td>

          </ng-container>

          <ng-container matColumnDef="source">

            <th mat-header-cell *matHeaderCellDef>
              Source IP
            </th>

            <td mat-cell *matCellDef="let incident">

              <code>
                {{ incident.source }}
              </code>

            </td>

          </ng-container>

          <ng-container matColumnDef="risk">

            <th mat-header-cell *matHeaderCellDef>
              Risk Score
            </th>

            <td mat-cell *matCellDef="let incident">

              <div class="risk">

                <strong>
                  {{ incident.risk }}
                </strong>

                <div class="risk-bar">

                  <div
                    class="risk-progress"
                    [style.width.%]="incident.risk">
                  </div>

                </div>

              </div>

            </td>

          </ng-container>

          <ng-container matColumnDef="severity">

            <th mat-header-cell *matHeaderCellDef>
              Severity
            </th>

            <td mat-cell *matCellDef="let incident">

              <span
                class="severity"
                [class]="incident.severity.toLowerCase()">

                {{ incident.severity }}

              </span>

            </td>

          </ng-container>

          <ng-container matColumnDef="status">

            <th mat-header-cell *matHeaderCellDef>
              Status
            </th>

            <td mat-cell *matCellDef="let incident">

              <span
                class="status"
                [class]="incident.status.toLowerCase()">

                <span class="status-dot"></span>

                {{ incident.status }}

              </span>

            </td>

          </ng-container>

          <ng-container matColumnDef="time">

            <th mat-header-cell *matHeaderCellDef>
              Detected
            </th>

            <td mat-cell *matCellDef="let incident">

              {{ incident.time }}

            </td>

          </ng-container>


          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns">
          </tr>

          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns;">
          </tr>

        </table>

      </div>

    </mat-card-content>

  </mat-card>

</div>
